# Cloudflare Workers entry for the Tower control plane.
# Nothing here requires a Cloudflare login: `pnpm dev` runs the Node host.
# The D1 binding and deploy steps are deferred; see DEFERRED.md.
name = "auto-tower"
main = "src/hosting/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Static dashboard files. The Workers entry serves /dashboard through this binding (src/hosting/worker.ts).
# run_worker_first sends every request through the Worker, so the dashboard policy headers and the
# file allowlist apply to direct requests too. The default html handling maps "/" to index.html.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
